<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="aiscanner: digitaliza notas manuscritas con OCR + IA local">
  <title>aiscanner</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8f3" />
      <stop offset="100%" stop-color="#f4ede6" />
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="320" fill="url(#bg)" />

  <!-- Tarjeta izquierda: nota manuscrita cruda -->
  <g transform="rotate(-4 210 160)">
    <rect x="55" y="70" width="310" height="180" rx="16" fill="#fef2e0" stroke="#cfc5b6" stroke-width="2" />
    <!-- lineas de renglon -->
    <line x1="90" y1="118" x2="335" y2="118" stroke="#e8ddc9" stroke-width="2" />
    <line x1="90" y1="150" x2="335" y2="150" stroke="#e8ddc9" stroke-width="2" />
    <line x1="90" y1="182" x2="335" y2="182" stroke="#e8ddc9" stroke-width="2" />
    <!-- garabatos de "escritura" -->
    <path d="M92,112 q9,-10 18,0 t18,0 t18,0 t18,0 t18,0 t18,0 t18,0 t18,0 t18,0 t18,0"
          fill="none" stroke="#6f5c31" stroke-width="3" stroke-linecap="round" opacity="0.85" />
    <path d="M92,144 q9,-10 18,0 t18,0 t18,0 t18,0 t18,0 t18,0 t18,0 t18,0"
          fill="none" stroke="#6f5c31" stroke-width="3" stroke-linecap="round" opacity="0.7" />
    <!-- boceto a mano: caja + flecha + caja, como un diagrama dibujado -->
    <rect x="92" y="196" width="46" height="30" rx="3" fill="none" stroke="#3d646f" stroke-width="2.5" />
    <path d="M142,211 h34" fill="none" stroke="#3d646f" stroke-width="2.5" />
    <path d="M168,204 l10,7 l-10,7" fill="none" stroke="#3d646f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="182" y="196" width="46" height="30" rx="3" fill="none" stroke="#3d646f" stroke-width="2.5" />
  </g>

  <!-- Titulo y tagline -->
  <text x="600" y="118" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#6f5c31">aiscanner</text>
  <text x="600" y="152" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#4c463b">Digitaliza notas manuscritas con OCR + IA, 100% en tu equipo</text>

  <!-- Pipeline: OCR -> LLM local -> Markdown -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <rect x="418" y="185" width="88" height="38" rx="19" fill="#efe1c6" stroke="#cfc5b6" />
    <text x="462" y="209" text-anchor="middle" fill="#6e634e">OCR</text>

    <path d="M512,204 h30" stroke="#9c8f72" stroke-width="2" />
    <path d="M534,197 l12,7 l-12,7" fill="none" stroke="#9c8f72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <rect x="552" y="185" width="130" height="38" rx="19" fill="#c5eefb" stroke="#a5cdda" />
    <text x="617" y="209" text-anchor="middle" fill="#245a66">LLM local</text>

    <path d="M688,204 h30" stroke="#9c8f72" stroke-width="2" />
    <path d="M710,197 l12,7 l-12,7" fill="none" stroke="#9c8f72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <rect x="728" y="185" width="120" height="38" rx="19" fill="#fee4ad" stroke="#dcc48f" />
    <text x="788" y="209" text-anchor="middle" fill="#786538">Markdown</text>
  </g>

  <!-- Candado: 100% local -->
  <g transform="translate(560 250)" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <path d="M0,10 h8 v-4 a4,4 0 0 1 8,0 v4 h8 v14 h-24 z" fill="none" stroke="#3d646f" stroke-width="2.2" stroke-linejoin="round" />
    <circle cx="12" cy="17" r="1.6" fill="#3d646f" />
    <text x="30" y="21" font-size="15" font-weight="600" fill="#3d646f">100% local — nada sale de tu equipo</text>
  </g>

  <!-- Tarjeta derecha: markdown limpio y estructurado -->
  <g transform="rotate(3 990 160)">
    <rect x="835" y="70" width="310" height="180" rx="16" fill="#ffffff" stroke="#cfc5b6" stroke-width="2" />
    <rect x="868" y="102" width="150" height="12" rx="3" fill="#6f5c31" />
    <rect x="868" y="132" width="230" height="9" rx="3" fill="#cfc5b6" />
    <rect x="868" y="152" width="200" height="9" rx="3" fill="#cfc5b6" />
    <rect x="868" y="172" width="215" height="9" rx="3" fill="#cfc5b6" />
    <rect x="868" y="200" width="12" height="12" rx="2" fill="none" stroke="#3d646f" stroke-width="2" />
    <path d="M870,206 l3,3 l6,-7" fill="none" stroke="#3d646f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="890" y="200" width="160" height="9" rx="3" fill="#cfc5b6" />
  </g>
</svg>
