{% extends "base.html" %}

{% block title %}Explorador — aiscanner{% endblock %}

{% block content %}
<h1 class="text-display-lg">Explorador</h1>

<div class="explorer-toolbar">
  <div class="path-bar" id="path-bar" style="flex: 1;"></div>
  <button class="btn btn--secondary" id="new-folder-btn">+ Nueva carpeta</button>
</div>

<div id="explorer-empty" class="empty-state" hidden>
  <p class="text-headline-sm">Todavía no hay documentos procesados aquí</p>
  <p class="text-body-md">Carga uno desde la página de <a href="/">Cargar</a>.</p>
</div>

<div id="explorer-grid" class="explorer-grid"></div>

<div id="viewer-overlay" class="viewer-overlay" hidden>
  <div class="viewer-panel">
    <button class="btn btn--tertiary" id="viewer-close">Cerrar ✕</button>
    <div id="viewer-content"></div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/explorer.js"></script>
{% endblock %}
